name = "nazihinary"
main = "_worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# Environment Variables (Secrets should be set via dashboard or wrangler secret)
# ============================================
[vars]
PROXYIP = "cdn-b100.xn--b6gac.eu.org"
PROXY_LIST_URL = "https://raw.githubusercontent.com/gprox-galaxy/Gproxy-domaip/refs/heads/main/PROXYIP.txt"
DNS_RESOLVER_URL = ["https://dns.google/dns-query","https://dns.quad9.net/dns-query"]

